services:
  api:
    build:
      context: ./api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: sqlite:/data/clockwork.db?mode=rwc
      ALLOW_ORIGIN: ${WEB_BASE_URL:-http://localhost:8080}
      EVENT_CLEANUP_INTERVAL_SECS: ${EVENT_CLEANUP_INTERVAL_SECS:-3600}
    volumes:
      - api-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: ./web
      args:
        # Vite inlines this at build time, so it must be a URL the
        # *browser* can reach (the published api port), not the
        # in-network service name.
        VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
