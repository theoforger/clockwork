openapi: 3.1.0

info:
  title: Clockwork
  version: 0.1.0
  description: Time scheduling API. A host creates an event and shares the link; attendees submit their available time slots and can see everyone else's submissions.

servers:
  - url: http://localhost:3000

paths:
  /events:
    post:
      summary: Create event
      description: Creates a new event and returns its ID. The host shares the event link with potential attendees.
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              name: "Team Sync"
              description: "Picking a time for the quarterly sync"
              starts_after: "2026-06-01T00:00:00"
              ends_before: "2026-06-30T23:59:59"
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventResponse'
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        '400':
          description: Malformed JSON body
        '422':
          description: Request body does not match the expected schema (e.g. missing `name`), or `starts_after` is not before `ends_before`
        '500':
          description: Internal server error

  /events/{event_id}:
    get:
      summary: Get event
      description: Returns the event along with all attendees and their submitted time slots.
      operationId: getEvent
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEventResponse'
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                name: "Team Sync"
                description: "Picking a time for the quarterly sync"
                starts_after: "2026-06-01T00:00:00"
                ends_before: "2026-06-30T23:59:59"
                created_at: "2026-05-01T10:00:00"
                attendees:
                  - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    name: "Alice"
                    emoji: "🦊"
                    comment: "Prefer mornings"
                    created_at: "2026-05-02T08:30:00"
                    time_slots:
                      - id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                        start_time: "2026-06-10T14:00:00"
                        end_time: "2026-06-10T15:00:00"
        '404':
          description: Event not found
        '500':
          description: Internal server error

  /events/{event_id}/time-slots:
    post:
      summary: Submit time slots
      description: Registers an attendee for the event and records one or more time slots where they are available. All slots are submitted in a single request.
      operationId: submitTimeSlots
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTimeSlotsRequest'
            example:
              name: "Alice"
              emoji: "🦊"
              comment: "Prefer mornings"
              time_slots:
                - start_time: "2026-06-10T14:00:00"
                  end_time: "2026-06-10T15:00:00"
                - start_time: "2026-06-11T09:00:00"
                  end_time: "2026-06-11T10:00:00"
      responses:
        '201':
          description: Attendee and time slots created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitTimeSlotsResponse'
              example:
                attendee_id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                token: "f1e2d3c4-b5a6-7890-1234-567890abcdef"
                time_slots:
                  - id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                    start_time: "2026-06-10T14:00:00"
                    end_time: "2026-06-10T15:00:00"
                  - id: "d4e5f6a7-b8c9-0123-defa-234567890123"
                    start_time: "2026-06-11T09:00:00"
                    end_time: "2026-06-11T10:00:00"
        '400':
          description: Malformed JSON body
        '422':
          description: Request body does not match the expected schema, `time_slots` is empty, a slot's `end_time` isn't after its `start_time`, or a slot falls outside the event's `starts_after`/`ends_before` window
        '500':
          description: Internal server error

  /events/{event_id}/attendees/{attendee_id}:
    put:
      summary: Edit attendee
      description: Replaces an existing attendee's profile fields and time slots. Requires the submission token returned once by `submitTimeSlots`.
      operationId: updateAttendee
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/AttendeeId'
        - $ref: '#/components/parameters/SubmissionToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitTimeSlotsRequest'
      responses:
        '200':
          description: Attendee updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAttendeeResponse'
        '400':
          description: Malformed JSON body
        '401':
          description: Missing X-Submission-Token header
        '404':
          description: Attendee not found on this event, or the token doesn't match
        '422':
          description: Request body does not match the expected schema, `time_slots` is empty, a slot's `end_time` isn't after its `start_time`, or a slot falls outside the event's `starts_after`/`ends_before` window
        '500':
          description: Internal server error

    delete:
      summary: Delete attendee
      description: Removes an attendee from the event along with all of their submitted time slots. Requires the submission token returned once by `submitTimeSlots`.
      operationId: deleteAttendee
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/AttendeeId'
        - $ref: '#/components/parameters/SubmissionToken'
      responses:
        '204':
          description: Attendee deleted
        '401':
          description: Missing X-Submission-Token header
        '404':
          description: Attendee not found on this event, or the token doesn't match
        '500':
          description: Internal server error

components:
  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      description: UUID of the event
      schema:
        type: string
        format: uuid
      example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    AttendeeId:
      name: attendee_id
      in: path
      required: true
      description: UUID of the attendee
      schema:
        type: string
        format: uuid
      example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"

    SubmissionToken:
      name: X-Submission-Token
      in: header
      required: true
      description: >-
        The token returned once, in the `submitTimeSlots` response, when
        this attendee was created. Unlike the attendee id, it's never
        returned by `getEvent`, so possessing it is what proves this is
        your own submission.
      schema:
        type: string
        format: uuid
      example: "f1e2d3c4-b5a6-7890-1234-567890abcdef"

  schemas:
    CreateEventRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the event
        description:
          type: string
          nullable: true
          description: Optional description
        starts_after:
          type: string
          format: date-time
          nullable: true
          description: Earliest allowed time slot start (ISO 8601, no timezone)
        ends_before:
          type: string
          format: date-time
          nullable: true
          description: Latest allowed time slot end (ISO 8601, no timezone)

    CreateEventResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the created event

    TimeSlotRequest:
      type: object
      required:
        - start_time
        - end_time
      properties:
        start_time:
          type: string
          format: date-time
          description: Start of the available time range (ISO 8601, no timezone)
        end_time:
          type: string
          format: date-time
          description: End of the available time range (ISO 8601, no timezone)

    SubmitTimeSlotsRequest:
      type: object
      required:
        - name
        - emoji
        - time_slots
      properties:
        name:
          type: string
          description: Display name of the attendee
        emoji:
          type: string
          description: Emoji used as a profile picture
        comment:
          type: string
          nullable: true
          description: Optional note from the attendee, shared across all their submitted slots
        time_slots:
          type: array
          minItems: 1
          description: One or more time slots the attendee is available
          items:
            $ref: '#/components/schemas/TimeSlotRequest'

    TimeSlotResponse:
      type: object
      required:
        - id
        - start_time
        - end_time
      properties:
        id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time

    SubmitTimeSlotsResponse:
      type: object
      required:
        - attendee_id
        - token
        - time_slots
      properties:
        attendee_id:
          type: string
          format: uuid
          description: UUID of the newly created attendee
        token:
          type: string
          format: uuid
          description: >-
            Secret required to edit or delete this submission later. Shown
            here once — store it; it cannot be recovered afterward, and it
            is never included in `getEvent`.
        time_slots:
          type: array
          items:
            $ref: '#/components/schemas/TimeSlotResponse'

    UpdateAttendeeResponse:
      type: object
      required:
        - attendee_id
        - time_slots
      properties:
        attendee_id:
          type: string
          format: uuid
        time_slots:
          type: array
          items:
            $ref: '#/components/schemas/TimeSlotResponse'

    AttendeeResponse:
      type: object
      required:
        - id
        - name
        - emoji
        - comment
        - created_at
        - time_slots
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emoji:
          type: string
          description: Emoji used as a profile picture
        comment:
          type: string
          nullable: true
          description: Optional note from the attendee, shared across all their submitted slots
        created_at:
          type: string
          format: date-time
          description: Time when the attendee made their submission
        time_slots:
          type: array
          items:
            $ref: '#/components/schemas/TimeSlotResponse'

    GetEventResponse:
      type: object
      required:
        - id
        - name
        - description
        - starts_after
        - ends_before
        - created_at
        - attendees
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        starts_after:
          type: string
          format: date-time
          nullable: true
        ends_before:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        attendees:
          type: array
          items:
            $ref: '#/components/schemas/AttendeeResponse'
